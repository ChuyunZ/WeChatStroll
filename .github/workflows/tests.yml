name: Run Tests

on:
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Issue 91 correction benchmark (synthetic map provider)
        run: node tests/benchmarks/issue91-route-correction.cjs

      - name: Issue 91 initial-candidate benchmark (synthetic map provider)
        run: node tests/benchmarks/issue91-initial-candidates.cjs
